name: Publish JSON to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"  # optional: rebuild daily at 03:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # If you need Python build, uncomment:
      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: "3.11"
      #
      # - name: Build data
      #   run: |
      #     pip install -r requirements.txt || true
      #     python scripts/build.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: data  # publish the "data" folder (will become the site root)

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
