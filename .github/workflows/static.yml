name: Publish JSON to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  # optional nightly rebuild
  schedule:
    - cron: "0 5 * * *"   # runs every day at 03:00 UTC

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Set up Python (if your script is Python-based)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install dependencies (if you have any)
      # Adjust or remove if not needed
      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # Run your JSON generator
      - name: Generate JSON files
        run: |
          mkdir -p data/2025/driver_data
          mkdir -p data/2025/constr_data
          mkdir -p data/2025/race_data
          mkdir -p data/2025/laps_data
          python scripts/make_jsons.py
          python scripts/make_laps_jsons.py

      # Commit and push updated JSON files back to repository
      - name: Commit and push updated files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/2025/driver_data/*.json
          git add data/2025/constr_data/*.json
          git add data/2025/race_data/*.json
          git diff --staged --quiet || git commit -m "Update driver JSON files [skip ci]"
          git push

      # Publish everything in /data as the website
      - name: Upload artifact (the site)
        uses: actions/upload-pages-artifact@v3
        with:
          path: data   # <— EVERYTHING in /data becomes your website root

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
